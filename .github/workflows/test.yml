name: tests

on:
  push:
    branches: ["master", "phase*/**", "srix"]
  pull_request:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  codegen-drift:
    # The generated parsers under pytamil/தமிழ்/codegen are committed. Regenerate them
    # from the grammars and fail if anything differs, so grammar and codegen cannot drift.
    name: codegen matches grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bash codegen.sh
      - name: fail on drift
        run: |
          git status --porcelain -- pytamil/தமிழ்/codegen
          git diff --exit-code --stat -- pytamil/தமிழ்/codegen
