name: tests

on:
  push:
    branches: ["master", "phase*/**", "srix"]
  pull_request:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  codegen-drift:
    # The generated parsers under pytamil/தமிழ்/codegen are committed. Regenerate them
    # from the grammars and fail if anything differs, so grammar and codegen cannot drift.
    name: codegen matches grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bash codegen.sh
      - name: fail on drift
        run: |
          git status --porcelain -- pytamil/தமிழ்/codegen
          git diff --exit-code --stat -- pytamil/தமிழ்/codegen

  lint:
    # The hand-written code is kept at pylint 10/10; .pylintrc records which checks this
    # project deliberately does not apply to Tamil identifiers and file names.
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pylint
      - run: python -m pylint pytamil pytamil/tests/*.py

  install:
    # The package must install from pyproject.toml into a clean environment, with its declared
    # dependencies, and import from outside the repo (no reliance on the checkout's cwd).
    name: pip install . (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: import and smoke-run from another directory
        working-directory: /tmp
        run: |
          python -c "from pytamil.தமிழ் import எழுத்து, மாத்திரை, புணர்ச்சி, சீர், தளை, வெண்பா, ஆசிரியப்பா, சொல்; import pytamil; print(pytamil.__version__)"
          python -c "from pytamil.தமிழ் import புணர்ச்சி, வெண்பா; assert புணர்ச்சி.தொடர்மொழி_ஆக்கு('விருந்து','ஓம்பல்') == ['விருந்தோம்பல்']; assert வெண்பா.ஆய்வு('எண்ணித் துணிகக் கருமம் துணிந்தபின்\nஎண்ணுவ மென்பதி ழுக்கு').சரியா"
