# -*- coding: utf-8 -*-
# புணர்ச்சி விதிகள். ஒவ்வொரு விதியும்
#     <நிலைமொழி வடிவம்> <புணர்ச்சிவகை> <வருமொழி வடிவம்> = <மாற்றம்> (, <மாற்றம்>)*
# புணர்ச்சிவகை: '+' பொது (இரு வழிக்கும்), '+வேற்றுமை+', '+அல்வழி+'. இலக்கணம்: resources/புணர்ச்சிவிதிகள்.g4;
# விளக்கம்: docs/புணர்ச்சிவிதிகள்.md. ஒரு சொல்லிணைக்கு பல விதிகள் பொருந்தினால் சிறப்புவிதி (மிகக் கட்டுப்பட்ட
# வடிவம்) பொதுவிதியை மறைக்கும். ஒவ்வொரு சான்றும் ஒரு சோதனை (test_புணர்ச்சி.py); வேற்றுமை/அல்வழி
# சான்றுகள் 'மண் +வேற்றுமை+ குடம் = மட்குடம்' என எழுதப்படும்.

# இஈ ஐவழி யவ்வும், ஏனை
# உயிர்வழி வவ்வும், ஏமுன் இவ் விருமையும்,
# உயிர்வரின் உடம்படு மெய் என்று ஆகும்.    (நன்னூல் , 162)
உயிர் முன் உயிர் புணர்தல்:
  இஈஐ உயிர்வரின் ய உடம்படு மெய் என்று ஆகும்:
    - விதி: (...)(இ,ஈ,ஐ) + (உயிர்)(...) = நிலைமொழி|உடம்படுமெய்(ய்) + வருமொழி
    - சான்று:
      - மணி + அடித்தான் > மணி + ய் + அடித்தான் = மணியடித்தான்
      - தீ + அணைத்தான் > தீ + ய் + அணைத்தான் = தீயணைத்தான்
      - வாழை + இலை > வாழை + ய் + இலை = வாழையிலை

  இஈஐ ஏனை உயிர்வழி வ உடம்படு மெய் என்று ஆகும்:
    - விதி: (...)(அ, ஆ,உ,ஊ,எ,ஒ,ஓ,ஔ) + (உயிர்)(...) = நிலைமொழி|உடம்படுமெய்(வ்) + வருமொழி
    - சான்று:
      - பல + இடங்கள் > பல + வ் + இடங்கள் = பலவிடங்கள்
      - நிலா + ஒளி > நிலா + வ் + ஒளி = நிலாவொளி
      - திரு + அருள் > திரு + வ் + அருள் = திருவருள்
      - பூ + அழகி > பூ + வ் + அழகி = பூவழகி
      - பசு + இனம் = பசுவினம்   # முற்றியலுகரம் (ஓரெழுத்துக் குறில் + உ): உகரம் கெடாது

  # நிலைமொழியின் ஈற்றில் ஏ என்னும் உயிர் எழுத்து நின்று, வருமொழியின் முதலில் ஏதேனும் ஓர் உயிர் எழுத்து வந்தால்,
  # அவற்றிற்கு இடையே யகரம், வகரம் ஆகிய இரண்டும் உடம்படுமெய்களாக வரும்.
  ஏமுன் உயிர்வரின் யவ உடம்படு மெய் என்று ஆகும்:
    - விதி: (...)(ஏ) + (உயிர்)(...) = நிலைமொழி|உடம்படுமெய்(ய்) + வருமொழி , நிலைமொழி|உடம்படுமெய்(வ்) + வருமொழி
    - சான்று:
      - சே + அடி = சேயடி , சேவடி # சே + அடி > சே + ய் + அடி = சேயடி , சே + அடி > சே + வ் + அடி = சேவடி

குற்றியலுகரப் புணர்ச்சி:
  # தொடர்க் குற்றியலுகரத்தின் (நெடிற்றொடர்: நாடு; வன்/மென்/இடைத்தொடர்: விருந்து, பந்து, கொய்து) முன் உயிர் வந்தால்
  # உகரம் கெட்டு, நின்ற மெய் வருமொழி உயிரோடு ஒன்றும் (நன்னூல், உயிரீற்றுப் புணரியல்: குற்றியலுகரம்).
  # முற்றியலுகரம் (பசு) இதில் அடங்காது; அது மேலே உடம்படுமெய் விதிக்குள். உயிர்த்தொடர் (அரசு) இன்னும் இல்லை.
  நெடிற்றொடர்க் குற்றியலுகரம் முன் உயிர் வரின் உகரம் கெடுதல்:
    - விதி: (...)(நெடில்)(குற்றியலுகரம்) + (உயிர்)(...) = நிலைமொழி|உயிர்கெடல் +இயல்பு+ வருமொழி
    - சான்று:
      - நாடு + இழந்தான் = நாடிழந்தான்
      - பாடு + அறியான் = பாடறியான்
  ஒற்றுத்தொடர்க் குற்றியலுகரம் முன் உயிர் வரின் உகரம் கெடுதல்:
    - விதி: (...)(மெய்)(குற்றியலுகரம்) + (உயிர்)(...) = நிலைமொழி|உயிர்கெடல் +இயல்பு+ வருமொழி
    - சான்று:
      - விருந்து + ஓம்பல் = விருந்தோம்பல்
      - பந்து + அடி = பந்தடி
      - கொய்து + எடுத்தான் = கொய்தெடுத்தான்

மெய் ஈற்றின் முன் உயிர்வந்து புணர்தல்:

  # நிலைமொழியின் இறுதியில் நிற்கும் மெய்யின்மேல்,
  # வருமொழியின் முதலில் உள்ள உயிர் வந்து கூடி உயிர்மெய்யாக மாறும்.
  # இவ்வாறு மாறுவது விகாரப் புணர்ச்சி அன்று; இயல்பு புணர்ச்சி ஆகும்.
  # நன்னூல் : நூற்பா: 204
  மெய்யின் மேல் உயிர் வந்து ஒன்றுதல்:
    - விதி: (...)(மெய்) + (உயிர்)(...) = நிலைமொழி +இயல்பு+ வருமொழி
    - சான்று:
      - உயிர் + எழுத்து = உயிரெழுத்து
      - வேல் + எறிந்தான் = வேலெறிந்தான்

  # நிலைமொழி தனிக்குறிலை அடுத்துவரும் ஒரு மெய்யைக் கொண்டதாக இருந்து,
  # வருமொழி முதலில் உயிர்வந்தால்,
  # நிலைமொழி இறுதியில் நிற்கும் அம்மெய்யானது இரட்டிக்கும்.
  # (சிறப்புவிதி: மேலுள்ள பொதுவிதியை மறைக்கும்)
  தனிக்குறில் முன் நின்ற மெய் உயிர்வரின் இரட்டுதல்:
    - விதி: (தனிக்குறில்)(மெய்) + (உயிர்)(...) = நிலைமொழி|இரட்டுதல் + வருமொழி
    - சான்று:
      - மெய் + எழுத்து = மெய்யெழுத்து
      - பல் + உடைந்தது = பல்லுடைந்தது
      - கல் + அது = கல்லது

ணகர, னகர ஈற்றுப் புணர்ச்சி விதிகள்:

  # ணன வல்லினம் வரட் டறவும், பிறவரின்
  # இயல்பும் ஆகும் வேற்றுமைக்கு; அல்வழிக்கு
  # அனைத்துமெய் வரினும் இயல்பு ஆகும்மே (நன்னூல், 209)
  ணகர, னகர ஈறுகள் இயல்பாதலும் திரிதலும்:
    # நிலைமொழியின் இறுதியில் உள்ள ணகர, னகரங்கள் வேற்றுமைப் புணர்ச்சியில் வருமொழி முதலில் வல்லினம் வந்தால் முறையே டகரமாகவும், றகரமாகவும் திரியும்:
    - விதி: (...)('ண்') +வேற்றுமை+ (வல்லினம்)(...) = நிலைமொழி|திரிதல்('ட்').வருமொழி
    - சான்று:
      - மண் +வேற்றுமை+ குடம் = மட்குடம்
      - சிறுகண் +வேற்றுமை+ களிறு = சிறுகட்களிறு
    - விதி: (...)('ன்') +வேற்றுமை+ (வல்லினம்)(...) = நிலைமொழி|திரிதல்('ற்').வருமொழி
    - சான்று:
      - பொன் +வேற்றுமை+ காசு = பொற்காசு
      - பொன் +வேற்றுமை+ குடம் = பொற்குடம்

    # வேற்றுமைப் புணர்ச்சியில் ணகர, னகரங்கள் மெல்லினமும், இடையினமும் வந்தால் இயல்பாகும்:
    - விதி: (...)('ண்','ன்') +வேற்றுமை+ (மெல்லினம்,இடையினம்)(...) = நிலைமொழி +இயல்பு+ வருமொழி
    - சான்று:
      - மண் +வேற்றுமை+ மேடை = மண்மேடை
      - பொன் +வேற்றுமை+ முடி = பொன்முடி
      - கண் +வேற்றுமை+ வலி = கண்வலி
      - பொன் +வேற்றுமை+ வளையல் = பொன்வளையல்

    # அல்வழிப் புணர்ச்சியில் ணகர, னகரங்கள் வல்லினம், மெல்லினம், இடையினம் என்னும் மூவினமெய்கள் வந்தாலும் இயல்பாகும்:
    - விதி: (...)('ண்','ன்') +அல்வழி+ (வல்லினம்,மெல்லினம்,இடையினம்)(...) = நிலைமொழி +இயல்பு+ வருமொழி
    - சான்று:
      - மண் +அல்வழி+ சரிந்தது = மண் சரிந்தது
      - பொன் +அல்வழி+ பெரிது = பொன் பெரிது
      - கண் +அல்வழி+ மங்கியது = கண் மங்கியது
      - பொன் +அல்வழி+ மலிந்தது = பொன் மலிந்தது
      - கண் +அல்வழி+ வலிக்கிறது = கண் வலிக்கிறது
      - பொன் +அல்வழி+ வலிது = பொன் வலிது

  # சில ணகர ஈற்றுப் பெயர்களுக்குச் சிறப்பு விதி:      TODO — விதியும் சான்றும் எழுதப்பட வேண்டும்
  # னகர ஈற்றுச் சாதிப்பெயர்க்குச் சிறப்பு விதி:       TODO — விதியும் சான்றும் எழுதப்பட வேண்டும்

  # மீன், தேன்: வேற்றுமையில் வல்லினம் வரினும் திரியாது இயல்பாகும் (சிறப்புவிதி; மேலுள்ள ன் -> ற் பொதுவிதியை மறைக்கும்)
  மீன் என்னும் சொல்லுக்குச் சிறப்பு விதி:
    - விதி: ('மீன்') +வேற்றுமை+ (வல்லினம்)(...) = நிலைமொழி +இயல்பு+ வருமொழி
    - சான்று:
      - மீன் +வேற்றுமை+ குழம்பு = மீன்குழம்பு
      - மீன் +வேற்றுமை+ கொடி = மீன்கொடி
  தேன் என்னும் சொல்லுக்குச் சிறப்பு விதி:
    - விதி: ('தேன்') +வேற்றுமை+ (வல்லினம்)(...) = நிலைமொழி +இயல்பு+ வருமொழி
    - சான்று:
      - தேன் +வேற்றுமை+ கூடு = தேன்கூடு
  # தன், என், நின் (இடப்பெயர்கள்): வேற்றுமையில் வல்லினம் வரினும் இயல்பாகும்
  தன், என், நின் என்னும் சொற்களுக்குச் சிறப்பு விதி:
    - விதி: (தன்,என்,நின்) +வேற்றுமை+ (வல்லினம்)(...) = நிலைமொழி +இயல்பு+ வருமொழி
    - சான்று:
      - தன் +வேற்றுமை+ கை = தன்கை
      - என் +வேற்றுமை+ தலை = என்தலை

மகர ஈற்றுப் புணர்ச்சி விதிகள்:
  # வேற்றுமையில்: வல்லினம் வரின் மகரம் கெட்டு வல்லினம் மிகும் (மரம் + கிளை = மரக்கிளை);
  # மெல்லினம் இடையினம் வரின் மகரம் கெட்டு இயல்பு (மரம் + வேர் = மரவேர்). அல்வழியில் இயல்பு (மரம் பெரிது).
  # (நன்னூல், மெய்யீற்றுப் புணரியல்: மகர ஈறு.) உயிர் வரும் இடம் (மரம் + அடி) இன்னும் இல்லை.
  மகர ஈற்றுப் புணர்ச்சி - பொதுவிதி:
    - விதி: (...)('ம்') +வேற்றுமை+ (வல்லினம்)(...) = நிலைமொழி|ஈறுகெடல் . முதலிரட்டுதல்|வருமொழி
    - சான்று:
      - மரம் +வேற்றுமை+ கிளை = மரக்கிளை
      - பணம் +வேற்றுமை+ பெட்டி = பணப்பெட்டி
      - நிலம் +வேற்றுமை+ தீவு = நிலத்தீவு
    - விதி: (...)('ம்') +வேற்றுமை+ (மெல்லினம்,இடையினம்)(...) = நிலைமொழி|ஈறுகெடல் . வருமொழி
    - சான்று:
      - மரம் +வேற்றுமை+ வேர் = மரவேர்
      - மரம் +வேற்றுமை+ நுனி = மரநுனி
    - விதி: (...)('ம்') +அல்வழி+ (மெய்)(...) = நிலைமொழி +இயல்பு+ வருமொழி
    - சான்று:
      - மரம் +அல்வழி+ பெரிது = மரம் பெரிது
      - பணம் +அல்வழி+ வந்தது = பணம் வந்தது

  # நும், தம், எம், நம்: வல்லினம் வரின் மகரம் அவ்வல்லினத்தின் இனமெல்லினமாகத் திரியும் (தம் + கை = தங்கை).
  # (சிறப்புவிதி: மேலுள்ள மகர ஈற்றுப் பொதுவிதியை மறைக்கும்; இரு வழிக்கும் பொது என வைத்துள்ளது.)
  நும், தம், எம், நம் என்னும் சொற்களுக்குச் சிறப்பு விதி:
    - விதி: (நும்,தம்,எம்,நம்) + (க்)(...) = நிலைமொழி|திரிதல்(ங்) . வருமொழி
    - சான்று:
      - தம் + கை = தங்கை
      - நும் + குலம் = நுங்குலம்
    - விதி: (நும்,தம்,எம்,நம்) + (ச்)(...) = நிலைமொழி|திரிதல்(ஞ்) . வருமொழி
    - சான்று:
      - தம் + சொல் = தஞ்சொல்
    - விதி: (நும்,தம்,எம்,நம்) + (த்)(...) = நிலைமொழி|திரிதல்(ந்) . வருமொழி
    - சான்று:
      - எம் + தலை = எந்தலை
    - விதி: (நும்,தம்,எம்,நம்) + (ப்)(...) = நிலைமொழி|திரிதல்(ம்) . வருமொழி
    - சான்று:
      - நம் + பகை = நம்பகை
